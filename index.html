.veil {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.3), rgba(0,0,0,.82) 100%),
    rgba(0, 0, 0, .35);
  pointer-events: none;
}
body.reveal .bg { opacity: 1; }

/* ---------- Stage (mobile: column) ---------- */
.stage {
  position: relative;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  direction: ltr;               /* logo on the left, panel on the right (desktop) */
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
}

/* ---------- Logo ---------- */
.logo {
  display: block;
  width: auto;
  height: min(60vh, 520px);
  max-width: 80vw;
  object-fit: contain;
  opacity: 0;
  filter: drop-shadow(0 0 26px rgba(212, 175, 94, .38));
  transition: opacity 1.6s ease, height 1.4s var(--ease), margin 1.4s var(--ease);
}
body.logo-in .logo { opacity: 1; }
body.moved .logo { height: clamp(120px, 22vh, 200px); margin-bottom: 20px; }

/* ---------- Panel (mobile: expands downward) ---------- */
.panel-wrap {
  display: grid;
  grid-template-rows: 0fr;
  width: min(100%, 360px);
  direction: rtl;
  transition: grid-template-rows 1.4s var(--ease);
}
body.moved .panel-wrap { grid-template-rows: 1fr; }
.panel {
  min-height: 0;
  overflow: hidden;
  opacity: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px;
  transition: opacity 1.2s ease .5s;
}
body.moved .panel { opacity: 1; }

/* ---------- Expandable pill ---------- */
.item {
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius);
  background: rgba(6, 6, 8, .55);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 22px rgba(212, 175, 94, .08);
  transition: border-color .3s, box-shadow .3s;
}
.item:hover, .item.open { border-color: var(--gold); box-shadow: 0 0 26px rgba(212, 175, 94, .18); }

.item-head {
  all: unset;
  box-sizing: border-box;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 56px;
  padding: 0 54px;
  cursor: pointer;
  border-radius: var(--radius);
}
.item-head:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }

.title { font-size: 1rem; font-weight: 500; color: #f6ecd6; }

.ico {
  position: absolute;
  right: 20px; top: 50%;
  width: 22px; height: 22px;
  margin-top: -11px;
  fill: none; stroke: var(--gold-light);
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.chev {
  position: absolute;
  left: 20px; top: 50%;
  width: 16px; height: 16px;
  margin-top: -8px;
  fill: none; stroke: var(--gold); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
  transition: transform .35s var(--ease);
}
.item.open .chev { transform: rotate(180deg); }

/* content that appears under the title */
.item-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .4s var(--ease);
}
.item.open .item-body { grid-template-rows: 1fr; }
.item-body .inner {
  min-height: 0;
  overflow: hidden;
  text-align: center;
  opacity: 0;
  transition: opacity .35s ease;
}
.item.open .item-body .inner { opacity: 1; transition-delay: .12s; }

.num {
  display: inline-block;
  margin: 0 0 14px;
  padding: 2px 8px;
  color: var(--gold-light);
  text-decoration: none;
  font-size: 1.15rem;
  font-weight: 400;
  letter-spacing: .07em;
}
.num:hover, .num:focus-visible { color: #fff; }
.item-body address {
  margin: 0;
  padding: 0 20px 16px;
  font-style: normal;
  font-weight: 300;
  line-height: 1.9;
  font-size: .92rem;
}

/* آدرس به انتخابگر مسیریاب خود گوشی وصل است */
.map-link {
  color: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.map-link:focus-visible {
  outline: 1px solid var(--gold-light);
  outline-offset: 4px;
  border-radius: 4px;
}
.inner:has(.num) { padding-top: 0; }

/* ---------- Social circles ---------- */
.socials {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding-top: 8px;
}
.circle {
  display: grid;
  place-items: center;
  width: 52px; height: 52px;
  border: 1px solid var(--gold-dim);
  border-radius: 50%;
  background: rgba(6, 6, 8, .55);
  box-shadow: 0 0 22px rgba(212, 175, 94, .1);
  color: var(--gold-light);
  transition: background .25s, color .25s, border-color .25s;
}
.circle svg { width: 22px; height: 22px; fill: currentColor; }
.circle:hover, .circle:focus-visible { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.circle:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }

/* ---------- Desktop: logo + panel shift to the right, Iran stays visible ---------- */
@media (min-width: 820px) {
  .stage {
    flex-direction: row;
    justify-content: center;
    gap: 0;
    padding-left: 24px;
    transition: padding-left 1.4s var(--ease);
  }
  body.moved .stage { padding-left: 40vw; }   /* pushes the whole group to the right */

  .logo { height: min(52vh, 440px); max-width: none; }
  body.moved .logo { height: min(52vh, 440px); margin-bottom: 0; }

  .panel-wrap {
    display: block;
    width: 0;
    overflow: hidden;
    transition: width 1.4s var(--ease);
  }
  body.moved .panel-wrap { width: min(400px, 30vw); }

  .panel {
    position: relative;
    width: min(400px, 30vw);
    padding: 8px 4px 8px 40px;
    overflow: visible;
  }
  .panel::before {            /* vertical gold divider */
    content: "";
    position: absolute;
    left: 0; top: -30px; bottom: -30px;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--gold-dim) 20%, var(--gold-dim) 80%, transparent);
  }

  /* keep the left side (Iran) bright, darken only the right where the content sits */
  .veil {
    background:
      linear-gradient(to left, rgba(0,0,0,.82), rgba(0,0,0,.35) 55%, rgba(0,0,0,.05) 100%);
  }
}

@media (max-width: 380px) {
  .item-head { padding: 0 48px; min-height: 52px; }
  .ico { right: 16px; } .chev { left: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .bg, .logo, .panel-wrap, .panel, .item-body, .item-body .inner, .chev { transition: none !important; }
}

  <script>
/* ====== تنظیمات / Settings ======
   آی‌دی‌ها را بدون @ و بدون لینک اینجا بنویسید.
   Example: telegram: "khorasani_shop"                                  */
const CONFIG = {
  telegram: "",    // آی‌دی تلگرام
  instagram: ""    // آی‌دی اینستاگرام
};

/* ====== Social links ====== */
function setupSocial(id, base, username) {
  const el = document.getElementById(id);
  const clean = (username || "").trim().replace(/^@/, "");
  if (clean) {
    el.href = base + clean;
  } else {
    el.addEventListener("click", e => e.preventDefault()); // ID not set yet
  }
}
setupSocial("telegram", "https://t.me/", CONFIG.telegram);
setupSocial("instagram", "https://instagram.com/", CONFIG.instagram);

/* ====== Expandable buttons (phone / mobile / address) ====== */
document.querySelectorAll(".item-head").forEach(btn => {
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const item = btn.closest(".item");
    const open = item.classList.toggle("open");
    btn.setAttribute("aria-expanded", open);
  });
});

/* ====== Intro sequence ====== */
const body = document.body;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function finish() {
  body.classList.add("logo-in", "reveal", "moved", "done");
}

if (reduce) {
  finish();
} else {
  setTimeout(() => body.classList.add("logo-in"), 400);           // logo appears
  setTimeout(() => body.classList.add("reveal", "moved"), 3000);  // logo moves, panel opens
  setTimeout(() => body.classList.add("done"), 4600);
  body.addEventListener("click", finish, { once: true });         // tap to skip
}

</script>
